<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instituto Vefago · Educação médica</title>
<meta name="description" content="Programas de educação médica conduzidos pela Dra. Júlia Vefago.">
<meta name="theme-color" content="#efece3">
<meta property="og:title" content="Instituto Vefago · Educação médica">
<meta property="og:description" content="Programas de educação médica conduzidos pela Dra. Júlia Vefago.">
<meta property="og:image" content="/assets/dra-julia-vefago.webp">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<link rel="icon" href="/assets/dra-julia-vefago.webp">
<link rel="preload" href="/assets/fonts/IvyOraText-Light.woff" as="font" type="font/woff" crossorigin>
<link rel="stylesheet" href="/assets/tokens.css">
<style>

@font-face{font-family:"IvyOra Text";src:url(/assets/fonts/IvyOraText-Light.woff) format("woff");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"New Science";src:url(/assets/fonts/NewScience-Thin.woff) format("woff");font-weight:100;font-style:normal;font-display:swap}
@font-face{font-family:"New Science";src:url(/assets/fonts/NewScience-Light.woff) format("woff");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"New Science";src:url(/assets/fonts/NewScience-Regular.woff) format("woff");font-weight:400;font-style:normal;font-display:swap}
@property --vf-a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes vf-spin{to{--vf-a:360deg}}
body{margin:0;background:#efece3;-webkit-font-smoothing:antialiased;font-synthesis:none}
a{color:#5d6979}a:hover{color:#464f5b}
.vf-wall{background-image:url(/assets/wallpaper.webp);background-repeat:repeat;background-size:340px auto;background-position:center top}
.vf-back-dark{border:1.5px solid transparent;background:linear-gradient(#2f353d,#2f353d) padding-box,conic-gradient(from var(--vf-a),rgba(242,226,181,0) 0deg,rgba(242,226,181,0) 200deg,#e5c56a 255deg,#f9f1da 282deg,#bdccdf 315deg,rgba(242,226,181,0) 355deg) border-box;animation:vf-spin 6s linear infinite;transition:transform .2s ease}
.vf-back-dark:hover{transform:translateY(-1px)}
.vf-back-dark:focus-visible{outline:2px solid #beccdf;outline-offset:3px}
.vf-form{border:1.5px solid transparent;background:linear-gradient(rgba(247,246,241,.95),rgba(247,246,241,.95)) padding-box,conic-gradient(from var(--vf-a),rgba(229,197,106,.25) 0deg,rgba(229,197,106,.25) 220deg,#ecd48f 265deg,#e5c56a 300deg,#ac9450 325deg,#f9f1da 345deg,rgba(229,197,106,.25) 360deg) border-box;animation:vf-spin 6s linear infinite;transition:transform .2s ease,box-shadow .25s ease}
.vf-form + .vf-form{animation-delay:-3s}
.vf-form:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(70,79,91,.12)}
.vf-form:focus-visible{outline:2px solid #5d6979;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.vf-back-dark,.vf-form{animation:none}}

html{background:#efece3}
body{min-height:100vh;background-color:#efece3;background-image:url(/assets/wallpaper.webp);background-repeat:repeat;background-size:340px auto}
.vf-root{width:100%;max-width:440px;min-height:100vh;min-height:100dvh;margin:0 auto}
@media (min-width:480px){.vf-root{box-shadow:0 0 0 1px rgba(195,173,137,.25),0 24px 60px rgba(70,79,91,.10)}}
</style>
</head>
<body>
<div class="vf-wall vf-root" style=" box-sizing: border-box; background-color: var(--surface); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; padding-bottom: 40px">

<header style="display: flex; flex-direction: column; gap: 36px; margin: 12px 12px 0; padding: 16px 20px 32px; border-radius: 0; background: var(--slate-600); color: var(--surface)">
<div style="display: flex; align-items: center; justify-content: space-between">
<a class="vf-back-dark" href="/" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px 0 10px; box-sizing: border-box; border-radius: 0; color: var(--surface); text-decoration: none; font-size: 11px; line-height: 16px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Início</a>
<span style="padding: 5px 10px; border-radius: var(--radius-pill); background: rgba(242,226,181,.10); border: 1px solid rgba(242,226,181,.4); font-size: 9.5px; line-height: 14px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-300)">Área para médicos</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="width: 40px; height: 3px; border-top: 1px solid var(--gold-400); border-bottom: 1px solid var(--gold-400)"></span>
<h1 style="margin: 0; font-family: var(--font-display); font-size: 42px; line-height: 44px; font-weight: 400; letter-spacing: 0; color: var(--surface)">Instituto Vefago</h1>
<p style="margin: 0; font-size: 13.5px; line-height: 21px; font-weight: 300; color: var(--slate-100)">Programas de educação médica conduzidos pela Dra. Júlia Vefago, direcionados a médicos e profissionais elegíveis.</p>
</div>
</header>

<main style="display: flex; flex-direction: column; gap: 12px; padding: 28px 20px 0">

<p style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 11px; line-height: 16px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brand)"><span style="width: 18px; height: 3px; border-top: 1px solid var(--gold-400); border-bottom: 1px solid var(--gold-400)"></span>Próximas turmas</p>

<a class="vf-form" href="https://docs.google.com/forms/d/e/1FAIpQLSfUgggn2UySko6z2KY2sZuaqsf3VmaBn15yWXkNY7LWhtRstw/viewform" target="_blank" rel="noopener noreferrer" style="display: flex; align-items: center; gap: 16px; padding: 16px; min-height: 88px; box-sizing: border-box; border-radius: 0; color: var(--ink); text-decoration: none">
<span style="flex: none; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 0; background: linear-gradient(145deg, var(--slate-300) 0%, var(--slate-400) 100%); color: #ffffff"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-family: var(--font-display); font-size: 21px; line-height: 26px; font-weight: 500">Lista de espera</span><span style="font-size: 12.5px; line-height: 18px; font-weight: 400; color: var(--brand-strong)">Seja avisado das próximas turmas.</span></span>
</a>

</main>

<footer style="display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: auto; padding: 40px 20px 0">
<span aria-hidden="true" style="width: 48px; height: 3px; border-top: 1px solid var(--gold-400); border-bottom: 1px solid var(--gold-400)"></span>
<img src="/assets/logo-vefago.png" alt="Vefago Clínica" style="width: 112px; height: auto">
</footer>

</div>
</body>
</html>
