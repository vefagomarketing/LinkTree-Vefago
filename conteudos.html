@property --vf-a{syntax:"<angle>";inherits:false;initial-value:0deg}

body{margin:0;background:#efece3;-webkit-font-smoothing:antialiased;font-synthesis:none}
a{color:#5d6979}a:hover{color:#464f5b}
.vf-wall{background-image:url(/assets/wallpaper.webp);background-repeat:repeat;background-size:340px auto;background-position:center top}
.vf-link{border:1.5px solid transparent;background:linear-gradient(160deg,#eff2f7 0%,#dee6ef 45%,#bdccdf 100%) padding-box,conic-gradient(from var(--vf-a),rgba(195,173,137,0) 0deg,rgba(195,173,137,0) 265deg,#ecd48f 295deg,#e5c56a 318deg,#ac9450 334deg,#5d6979 352deg,rgba(195,173,137,0) 360deg) border-box,linear-gradient(#d7c8b1,#d7c8b1) border-box;animation:vf-spin 6s linear infinite;transition:transform .2s ease,box-shadow .25s ease}

.vf-link:hover,.vf-back:hover{transform:translateY(-1px)}
.vf-link:hover{box-shadow:0 12px 28px rgba(70,79,91,.14)}
.vf-link:active{transform:scale(.99)}
.vf-link:focus-visible,.vf-back:focus-visible{outline:2px solid #5d6979;outline-offset:3px}
.vf-form{border:1.5px solid transparent;background:linear-gradient(rgba(247,246,241,.95),rgba(247,246,241,.95)) padding-box,conic-gradient(from var(--vf-a),rgba(229,197,106,.25) 0deg,rgba(229,197,106,.25) 220deg,#ecd48f 265deg,#e5c56a 300deg,#ac9450 325deg,#f9f1da 345deg,rgba(229,197,106,.25) 360deg) border-box;animation:vf-spin 6s linear infinite;transition:transform .2s ease,box-shadow .25s ease}

.vf-form:focus-visible{outline:2px solid #5d6979;outline-offset:3px}
